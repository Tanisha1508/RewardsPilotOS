# Availability alert for the Render backend. (Was the keepalive until
# 2026-07-30 — see below for why it was never actually doing that job.)
#
# Render free instances spin down after ~15 minutes idle. The next request pays
# the wake-up: measured 15.6 s on 2026-07-29, and 36.0 s on 2026-07-30 (a warm
# call to the same endpoint is ~1.2 s). That is the "dashboard takes ages to
# load" symptom — the page itself is fine, it is waiting on a container that
# went to sleep.
#
# ── Why a daily window rather than 24/7 ──────────────────────────────────────
# The free tier allows 750 instance-hours/month. Keeping the service awake
# around the clock costs ~730 h, which fits but leaves no headroom for a second
# service or a busy month. This window (01:00–17:59 UTC = 06:30–23:29 IST)
# costs ~17 h/day, roughly 517 h/month, and covers the hours the app is
# actually used. Outside it the first request of the day still pays one wake-up.
#
# To go 24/7, change the hour field to `*`, and watch the Render usage meter.
#
# ── The caveat above turned out to be an understatement (measured 2026-07-30) ─
# This workflow asks for `*/10`. What it actually ran:
#
#     16:58Z (51s)   15:20Z (50s)   13:04Z (9s)   11:21Z (42s)   09:11Z (14s)
#
# Roughly every 90–120 minutes. And the 42–51 second durations are the tell:
# each ping was itself paying a cold start, so the service had already spun
# down between pings. The workflow was green and achieving nothing.
#
# **Keeping the backend awake is now `infra/monitoring/keepalive_pg_cron.sql`**,
# a pg_cron job in Supabase that runs on a real scheduler, needs no extra
# account, and actually fires every ten minutes.
#
# ── So why is this workflow still here ──────────────────────────────────────
# Because it does something pg_cron does not: it *fails loudly*. `net.http_get`
# fires and forgets, so a backend returning 500 looks identical to one returning
# 200 unless someone queries `net._http_response`. The step below exits non-zero
# on any non-200, which sends the owner an email.
#
# The division of labour, now explicit: pg_cron keeps the service awake,
# this workflow notices when it is broken. An unreliable schedule is fatal for
# the first job and merely means "checked a few times a day" for the second,
# which is a reasonable cadence for an availability alert on a hobby project.
#
# Hits /health only: no auth, no database writes, no LLM call, no quota cost.

name: keepalive

on:
  schedule:
    # Hourly, not */10: pg_cron does the keeping-awake now, so this only needs
    # to notice breakage. Kept inside the same 01:00–17:59 UTC window on
    # purpose — a ping outside it would wake the service and spend the instance
    # hours the window exists to save.
    - cron: "0 1-17 * * *" # hourly, 01:00–17:59 UTC (06:30–23:29 IST)
  workflow_dispatch: {}

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend health
        run: |
          # --max-time 120 so a genuine cold start is waited out rather than
          # counted as a failure; a wake can take far longer than a warm call.
          code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 120 \
            https://rewardspilotos.onrender.com/api/v1/health) || true
          echo "status=$code"
          cat /tmp/body || true
          # A non-200 is worth surfacing: the backend is down, not just asleep.
          if [ "$code" != "200" ]; then
            echo "::error::health check returned $code"
            exit 1
          fi
